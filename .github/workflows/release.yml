name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: tigorra-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: tigorra-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: tigorra-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: tigorra-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev \
            libxi-dev libxcursor-dev libxrandr-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/tigorra.exe" dist/Tigorra.exe
            cp README.md dist/README.md
            7z a "${{ matrix.asset }}.zip" ./dist/*
          else
            cp "target/${{ matrix.target }}/release/tigorra" dist/tigorra
            chmod +x dist/tigorra
            cp README.md dist/README.md
            if [[ "${{ matrix.target }}" == *linux* ]]; then cp tigorra.desktop dist/; fi
            tar -czf "${{ matrix.asset }}.tar.gz" -C dist .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: tigorra-*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la release-assets
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tigorra $GITHUB_REF_NAME" \
            --generate-notes
